services:
  db:
    image: pgvector/pgvector:pg16
    container_name: chewy-autoship-db
    environment:
      POSTGRES_DB: chewy_autoship
      POSTGRES_USER: chewy
      POSTGRES_PASSWORD: chewy_local_only
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chewy -d chewy_autoship"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
